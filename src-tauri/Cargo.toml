[package]
name = "scrumban"
version = "2.0.0"
description = "Scrumban Pessoal — quadro Scrumban offline-first para desenvolvedores solo"
authors = ["Pedr0bert"]
license = "GPL-3.0"
repository = "https://github.com/Pedr0bert/Scrumban"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Binário menor e mais rápido no instalador final
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
