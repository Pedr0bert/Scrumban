<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradientes da paleta terrosa Scrumban -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <linearGradient id="terracotaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C77865"/>
      <stop offset="100%" stop-color="#BD6B58"/>
    </linearGradient>
    <linearGradient id="musgoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A2AE95"/>
      <stop offset="100%" stop-color="#889679"/>
    </linearGradient>
    <linearGradient id="caramelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEB083"/>
      <stop offset="100%" stop-color="#C9945F"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2D2B2A" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Offwhite com borda de contraste Bege -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#E2DCD2" stroke-width="12"/>

  <!-- Coluna 1: Backlog / To Do (Caramelo / Tons Quentes) -->
  <rect x="76" y="96" width="104" height="320" rx="18" fill="#ECE6DC"/>
  <!-- Cabeçalho da coluna 1 -->
  <rect x="94" y="118" width="44" height="10" rx="5" fill="#BDB4A5"/>
  <!-- Cards Coluna 1 -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="146" width="80" height="76" rx="14" fill="#FAF8F5" stroke="#DFD7CA" stroke-width="2"/>
    <rect x="100" y="162" width="56" height="8" rx="4" fill="url(#caramelGrad)"/>
    <rect x="100" y="178" width="36" height="6" rx="3" fill="#D5CCC0"/>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="88" y="236" width="80" height="76" rx="14" fill="#FAF8F5" stroke="#DFD7CA" stroke-width="2"/>
    <rect x="100" y="252" width="56" height="8" rx="4" fill="#C5BCB0"/>
    <rect x="100" y="268" width="42" height="6" rx="3" fill="#D5CCC0"/>
  </g>

  <!-- Coluna 2: In Progress (Terracota - Foco e WIP) -->
  <rect x="204" y="96" width="104" height="320" rx="18" fill="#F4E9E5" stroke="#BD6B58" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.4"/>
  <!-- Cabeçalho da coluna 2 com indicador terracota -->
  <circle cx="220" cy="123" r="6" fill="#BD6B58"/>
  <rect x="234" y="118" width="44" height="10" rx="5" fill="#BD6B58" fill-opacity="0.7"/>
  <!-- Card Ativo em Destaque -->
  <g filter="url(#cardShadow)">
    <rect x="216" y="146" width="80" height="104" rx="14" fill="url(#terracotaGrad)"/>
    <!-- Linhas do Card Ativo -->
    <rect x="228" y="164" width="56" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="228" y="181" width="38" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.75"/>
    <rect x="228" y="210" width="24" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.3"/>
    <circle cx="272" cy="217" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="216" y="264" width="80" height="72" rx="14" fill="#FAF8F5" stroke="#E6D3CD" stroke-width="2"/>
    <rect x="228" y="280" width="56" height="8" rx="4" fill="#D5CCC0"/>
    <rect x="228" y="296" width="32" height="6" rx="3" fill="#E2DCD2"/>
  </g>

  <!-- Coluna 3: Done (Musgo - Conclusão e Entregas) -->
  <rect x="332" y="96" width="104" height="320" rx="18" fill="#EAEFE7"/>
  <!-- Cabeçalho da coluna 3 -->
  <rect x="350" y="118" width="44" height="10" rx="5" fill="#A4B399"/>
  <!-- Cards Concluídos com Checkmark -->
  <g filter="url(#cardShadow)">
    <rect x="344" y="146" width="80" height="76" rx="14" fill="#FAF8F5" stroke="#D3DDD0" stroke-width="2"/>
    <rect x="356" y="162" width="40" height="8" rx="4" fill="url(#musgoGrad)"/>
    <path d="M394 162 L399 167 L409 157" fill="none" stroke="#889679" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="356" y="178" width="48" height="6" rx="3" fill="#CCD8C8"/>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="344" y="236" width="80" height="76" rx="14" fill="#FAF8F5" stroke="#D3DDD0" stroke-width="2"/>
    <rect x="356" y="252" width="40" height="8" rx="4" fill="url(#musgoGrad)"/>
    <path d="M394 252 L399 257 L409 247" fill="none" stroke="#889679" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="356" y="268" width="34" height="6" rx="3" fill="#CCD8C8"/>
  </g>
</svg>
